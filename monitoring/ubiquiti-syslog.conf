@version: 3.38

options {
  chain_hostnames(off);
  flush_lines(0);
  use_dns(no);
  keep_hostname(no);
};

source s_udp {
  udp(ip(0.0.0.0) port(514));
};

destination d_ubiquiti {
  file("/var/log/ubiquiti/ubiquiti.log"
    template("${ISODATE} ${HOST} ${PROGRAM} ${MSG}\n"));
};

log {
  source(s_udp);
  destination(d_ubiquiti);
  flags(final);
};
