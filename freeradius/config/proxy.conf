# proxy.conf - Configuracao de proxy RADIUS
# Define servidores home e realms para encaminhamento de requisicoes

proxy server {
  default_fallback = no
}

# Realm padrao (local - nao faz proxy)
realm LOCAL {
}

# Realm nulo - trata requisicoes sem realm
realm NULL {
}

